<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<title>Terapeut Admin — Tryggman</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:#1C2B35;color:#fff;height:100vh;overflow:hidden}

/* LOGIN */
.login-screen{position:fixed;inset:0;background:#1C2B35;display:flex;align-items:center;justify-content:center;z-index:100}
.login-screen.hidden{display:none}
.login-card{background:#2E4050;padding:2.5rem;max-width:400px;width:90%;border-radius:2px}
.login-logo{font-family:'DM Serif Display',serif;font-size:1.8rem;color:#fff;margin-bottom:0.3rem}
.login-sub{font-size:0.8rem;color:rgba(255,255,255,0.4);margin-bottom:2rem}
.login-field{width:100%;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);padding:0.82rem 1rem;color:#fff;font-family:'DM Sans',sans-serif;font-size:0.88rem;border-radius:2px;outline:none;margin-bottom:0.8rem}
.login-field:focus{border-color:#3A7D6E}
.login-field::placeholder{color:rgba(255,255,255,0.3)}
.login-btn{width:100%;background:#3A7D6E;border:none;color:#fff;padding:0.85rem;border-radius:2px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;transition:background 0.2s}
.login-btn:hover{background:#4E9E8D}
.login-error{font-size:0.78rem;color:#ff6b6b;margin-bottom:0.8rem;display:none}

/* ADMIN LAYOUT */
.admin-layout{display:none;height:100vh;grid-template-columns:300px 1fr;grid-template-rows:56px 1fr}
.admin-layout.active{display:grid}

/* TOPBAR - mörk */
.topbar{grid-column:1/-1;background:#1C2B35;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
.topbar-logo{font-family:'DM Serif Display',serif;font-size:1.2rem;color:#fff}
.topbar-badge{font-size:0.72rem;color:#4E9E8D;background:rgba(78,158,141,0.1);padding:0.2rem 0.6rem;border-radius:2px;margin-left:0.8rem}
.topbar-right{display:flex;align-items:center;gap:1rem}
.topbar-user{font-size:0.78rem;color:rgba(255,255,255,0.4)}
.logout-btn{background:none;border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);padding:0.3rem 0.8rem;font-size:0.75rem;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:2px;transition:all 0.2s}
.logout-btn:hover{border-color:rgba(255,255,255,0.4);color:#fff}

/* SIDEBAR - halvmörk */
.sidebar{background:#2E4050;border-right:1px solid rgba(255,255,255,0.06);overflow-y:auto;display:flex;flex-direction:column}
.sidebar-header{padding:1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between}
.sidebar-title{font-size:0.72rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(255,255,255,0.5)}
.unread-badge{background:#C0873A;color:#fff;font-size:0.65rem;padding:0.15rem 0.5rem;border-radius:10px}

.conv-list{flex:1;overflow-y:auto}
.conv-item{padding:1rem 1.2rem;border-bottom:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:background 0.15s;position:relative}
.conv-item:hover{background:rgba(255,255,255,0.05)}
.conv-item.active{background:rgba(58,125,110,0.2);border-left:3px solid #3A7D6E}
.conv-item.unread{border-left:3px solid #C0873A}
.conv-name{font-size:0.88rem;font-weight:500;color:#fff;margin-bottom:0.2rem}
.conv-preview{font-size:0.75rem;color:rgba(255,255,255,0.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:0.3rem}
.conv-meta{display:flex;align-items:center;justify-content:space-between}
.conv-time{font-size:0.68rem;color:rgba(255,255,255,0.3)}
.conv-unread-dot{width:8px;height:8px;border-radius:50%;background:#C0873A}
.conv-empty{padding:2rem 1.2rem;text-align:center;color:rgba(255,255,255,0.3);font-size:0.85rem}

/* CHAT AREA - ljus */
.chat-area{display:flex;flex-direction:column;overflow:hidden;background:#FAFAF7}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem;color:#6B7A85}
.chat-empty-icon{font-size:3rem}
.chat-empty p{font-size:0.88rem}

.chat-header{padding:1rem 1.5rem;background:#fff;border-bottom:1px solid rgba(28,43,53,0.08);flex-shrink:0;display:none}
.chat-header.active{display:flex;align-items:center;justify-content:space-between}
.chat-header-name{font-family:'DM Serif Display',serif;font-size:1.1rem;color:#1C2B35}
.chat-header-email{font-size:0.75rem;color:#6B7A85;margin-top:0.1rem}
.chat-header-status{font-size:0.72rem;background:rgba(58,125,110,0.1);color:#3A7D6E;padding:0.2rem 0.6rem;border-radius:2px}

#adminMessages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;display:none;background:#FAFAF7}
#adminMessages.active{display:flex}
#adminMessages::-webkit-scrollbar{width:3px}
#adminMessages::-webkit-scrollbar-thumb{background:rgba(28,43,53,0.12);border-radius:2px}

/* Meddelanden - iMessage stil */
.message{max-width:70%;padding:0.85rem 1.1rem;font-size:0.88rem;line-height:1.65;border-radius:12px}
.message.user{background:#fff;color:#1C2B35;align-self:flex-start;border:1px solid rgba(28,43,53,0.1);border-bottom-left-radius:2px;box-shadow:0 1px 4px rgba(28,43,53,0.06)}
.message.therapist{background:#3A7D6E;color:#fff;align-self:flex-end;border-bottom-right-radius:2px}
.message.system{background:rgba(58,125,110,0.08);color:#3A7D6E;align-self:center;font-size:0.75rem;text-align:center;padding:0.4rem 1rem;border-radius:2px}
.message-sender{font-size:0.65rem;color:#6B7A85;margin-bottom:0.3rem}
.message-time{font-size:0.65rem;margin-top:0.3rem}
.message.user .message-time{color:#6B7A85;text-align:left}
.message.therapist .message-time{color:rgba(255,255,255,0.55);text-align:right}

/* Svarsruta - ljus */
.reply-area{padding:1rem 1.5rem;background:#fff;border-top:1px solid rgba(28,43,53,0.08);flex-shrink:0;display:none}
.reply-area.active{display:block}
.reply-row{display:flex;gap:0.5rem}
#replyInput{flex:1;background:#F2EDE5;border:none;padding:0.7rem 1rem;color:#1C2B35;font-family:'DM Sans',sans-serif;font-size:0.88rem;border-radius:20px;outline:none;resize:none;min-height:42px;max-height:120px}
#replyInput::placeholder{color:#6B7A85}
.reply-btn{background:#3A7D6E;border:none;color:#fff;padding:0.7rem 1.2rem;border-radius:20px;cursor:pointer;font-size:0.85rem;font-weight:500;font-family:'DM Sans',sans-serif;transition:background 0.2s;white-space:nowrap}
.reply-btn:hover{background:#4E9E8D}
.reply-btn:disabled{opacity:0.4;cursor:not-allowed}
.reply-note{font-size:0.68rem;color:#6B7A85;margin-top:0.5rem}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo">Tryggman</div>
    <div class="login-sub">Terapeut-portal</div>
    <div class="login-error" id="loginError">Fel e-post eller lösenord.</div>
    <input class="login-field" type="email" id="loginEmail" placeholder="E-post">
    <input class="login-field" type="password" id="loginPassword" placeholder="Lösenord">
    <button class="login-btn" onclick="doLogin()">Logga in</button>
  </div>
</div>

<!-- ADMIN -->
<div class="admin-layout" id="adminLayout">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <span class="topbar-logo">Tryggman</span>
      <span class="topbar-badge">Terapeut-portal</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-user" id="topbarUser"></span>
      <button class="logout-btn" onclick="doLogout()">Logga ut</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">Konversationer</span>
      <span class="unread-badge" id="unreadBadge" style="display:none">0</span>
    </div>
    <div class="conv-list" id="convList">
      <div class="conv-empty">Laddar konversationer...</div>
    </div>
  </div>

  <div class="chat-area">
    <div class="chat-empty" id="chatEmpty">
      <div class="chat-empty-icon">💬</div>
      <p>Välj en konversation för att svara</p>
    </div>

    <div class="chat-header" id="chatHeader">
      <div>
        <div class="chat-header-name" id="headerName"></div>
        <div class="chat-header-email" id="headerEmail"></div>
      </div>
      <div class="chat-header-status">Aktiv</div>
    </div>

    <div id="adminMessages"></div>

    <div class="reply-area" id="replyArea">
      <div class="reply-row">
        <textarea id="replyInput" placeholder="Skriv ditt svar..." rows="1"></textarea>
        <button class="reply-btn" id="replyBtn" onclick="sendReply()">Skicka svar</button>
      </div>
      <div class="reply-note">Tryck Enter för att skicka · Shift+Enter för ny rad</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyC-hMsjidzd--a4buvtAapLWpXmbj2yaH4",
  authDomain: "tryggman-b89fa.firebaseapp.com",
  projectId: "tryggman-b89fa",
  storageBucket: "tryggman-b89fa.firebasestorage.app",
  messagingSenderId: "871100564839",
  appId: "1:871100564839:web:0515b9d9d706706c335bc2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentConvId = null;
let messageUnsubscribe = null;

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('adminLayout').classList.add('active');
    document.getElementById('topbarUser').textContent = user.email;
    loadConversations();
  } else {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('adminLayout').classList.remove('active');
  }
});

window.doLogin = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(e) {
    errorEl.style.display = 'block';
  }
};

window.doLogout = async function() {
  await signOut(auth);
  currentConvId = null;
};

document.getElementById('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') window.doLogin();
});

function loadConversations() {
  const q = query(collection(db, 'conversations'), orderBy('createdAt', 'desc'));
  onSnapshot(q, async (snapshot) => {
    const list = document.getElementById('convList');
    list.innerHTML = '';
    if (snapshot.empty) {
      list.innerHTML = '<div class="conv-empty">Inga konversationer än.</div>';
      return;
    }
    let unreadCount = 0;
    for (const docSnap of snapshot.docs) {
      const conv = docSnap.data();
      const convId = docSnap.id;
      const msgQ = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp', 'desc'));
      const msgSnap = await getDocs(msgQ);
      let lastMsg = '';
      let hasUnread = false;
      if (!msgSnap.empty) {
        const last = msgSnap.docs[0].data();
        lastMsg = last.content || '';
        if (last.role === 'user') { hasUnread = true; unreadCount++; }
      }
      const item = document.createElement('div');
      item.className = `conv-item${hasUnread ? ' unread' : ''}${convId === currentConvId ? ' active' : ''}`;
      item.innerHTML = `
        <div class="conv-name">${conv.userName || 'Anonym'}</div>
        <div class="conv-preview">${lastMsg.substring(0, 60)}${lastMsg.length > 60 ? '...' : ''}</div>
        <div class="conv-meta">
          <span class="conv-time">${conv.createdAt ? new Date(conv.createdAt.toDate()).toLocaleDateString('sv-SE') : ''}</span>
          ${hasUnread ? '<span class="conv-unread-dot"></span>' : ''}
        </div>`;
      item.onclick = () => openConversation(convId, conv.userName, conv.userEmail);
      list.appendChild(item);
    }
    const badge = document.getElementById('unreadBadge');
    if (unreadCount > 0) { badge.textContent = unreadCount; badge.style.display = 'inline'; }
    else { badge.style.display = 'none'; }
  });
}

window.openConversation = function(convId, name, email) {
  currentConvId = convId;
  document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
  document.getElementById('chatEmpty').style.display = 'none';
  document.getElementById('chatHeader').classList.add('active');
  document.getElementById('adminMessages').classList.add('active');
  document.getElementById('replyArea').classList.add('active');
  document.getElementById('headerName').textContent = name || 'Anonym';
  document.getElementById('headerEmail').textContent = email || '';
  if (messageUnsubscribe) messageUnsubscribe();
  const q = query(collection(db, 'conversations', convId, 'messages'), orderBy('timestamp', 'asc'));
  messageUnsubscribe = onSnapshot(q, (snapshot) => {
    const container = document.getElementById('adminMessages');
    container.innerHTML = '';
    snapshot.forEach(docSnap => {
      const msg = docSnap.data();
      const div = document.createElement('div');
      div.className = `message ${msg.role}`;
      if (msg.role === 'user') {
        const sender = document.createElement('div');
        sender.className = 'message-sender';
        sender.textContent = name || 'Användare';
        div.appendChild(sender);
      }
      const content = document.createElement('div');
      content.textContent = msg.content;
      div.appendChild(content);
      if (msg.timestamp && msg.role !== 'system') {
        const time = document.createElement('div');
        time.className = 'message-time';
        const date = msg.timestamp.toDate ? msg.timestamp.toDate() : new Date();
        time.textContent = date.toLocaleString('sv-SE', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
        div.appendChild(time);
      }
      container.appendChild(div);
    });
    container.scrollTop = container.scrollHeight;
  });
};

window.sendReply = async function() {
  if (!currentConvId) return;
  const input = document.getElementById('replyInput');
  const message = input.value.trim();
  if (!message) return;
  const btn = document.getElementById('replyBtn');
  btn.disabled = true;
  input.value = '';
  input.style.height = 'auto';
  try {
    await addDoc(collection(db, 'conversations', currentConvId, 'messages'), {
      role: 'therapist', content: message, timestamp: serverTimestamp()
    });
  } catch(e) { console.error(e); }
  finally { btn.disabled = false; }
};

document.getElementById('replyInput').addEventListener('input', (e) => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
});
document.getElementById('replyInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.sendReply(); }
});
</script>
</body></html>
